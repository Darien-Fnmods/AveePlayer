plugins{
    id 'com.android.application'
}
android {
    namespace "com.aveeopen"
    compileSdk 36

    defaultConfig {
        applicationId "com.aveeopen"
        targetSdk =28
        minSdk=26
        multiDexEnabled true
        versionCode 34
        versionName "1.0.34" //Set desired version (Optional) //APP RESKIN
    }

    buildTypes {
        release {
            minifyEnabled true //Set to true in PUBLISH VERSION
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = "17"
        targetCompatibility = "17"
    }
}

repositories {
    google()
    mavenCentral()
    maven { url "https://jitpack.io" }

    flatDir {
        dirs 'libs'
    }

}

dependencies {
    api fileTree(include: ['*.jar'], dir: 'libs')
    api group: 'com.google.guava', name: 'guava', version: '33.5.0-jre'
    implementation(name:'ExoPlayer-library-release', ext:'aar')
    implementation(name:'recyclerviewfastscroller-release', ext:'aar')
    //implementation 'com.squareup.picasso:picasso:2.5.2'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.viewpager:viewpager:1.1.0'
    implementation 'androidx.interpolator:interpolator:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.gms:play-services-ads:24.9.0'
    implementation 'junit:junit:4.13.2'

    implementation 'com.google.android.material:material:1.14.0-alpha05'
    implementation "androidx.appcompat:appcompat:1.7.1"

}
